name: Dependency advisory review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/linux-py312-tooling.txt
      - name: Read-only advisory queries (no provider or AI requests)
        run: |
          for lock in requirements/*-py312-{runtime,dev,tooling}.txt; do
            python -m pip_audit --disable-pip --no-deps --require-hashes -r "$lock" || exit "$?"
          done
