[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "0.1.0"
description = "IOC investigation CLI with optional intelligence and evidence-grounded reporting"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Salahuddin Alrowaili"}]
keywords = ["ioc", "security", "threat-intelligence", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]

readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<15",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "idna>=3.10,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/Salah-f4/TraceGuard"
Issues = "https://github.com/Salah-f4/TraceGuard/issues"

[project.scripts]
traceguard = "traceguard.adapters.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traceguard*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=traceguard --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.coverage.run]
source = ["traceguard"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
